<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>ISL Translator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        body {
            margin: 0;
            font-family: Inter, system-ui, sans-serif;
            background: linear-gradient(135deg, #020617, #0f172a);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 420px;
            padding: 22px;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(14px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
        }

        h1 {
            text-align: center;
            margin-bottom: 14px;
        }

        .camera {
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 0 0 2px rgba(0, 255, 213, 0.5),
                0 0 25px rgba(0, 255, 213, 0.25);
        }

        video {
            width: 100%;
            background: black;
        }

        .output {
            margin-top: 16px;
            padding: 14px;
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.35);
            text-align: center;
        }

        .sign {
            font-size: 46px;
            font-weight: 700;
            color: #00ffd5;
        }

        .conf {
            opacity: 0.85;
            font-size: 14px;
        }

        button {
            width: 100%;
            margin-top: 14px;
            padding: 12px;
            border-radius: 14px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            background: #00ffd5;
            color: black;
        }

        canvas {
            display: none;
        }
    </style>
</head>

<body>
    <div class="app">
        <h1>Voice Of Hands</h1>
        

        <div class="camera">
            <video id="video" autoplay muted playsinline></video>
        </div>

        <div class="output">
            <div id="sign" class="sign">—</div>
            <div id="conf" class="conf">Waiting for sign…</div>
        </div>

        <button id="start">Start Camera</button>

        <canvas id="canvas"></canvas>
    </div>

    <script src="app.js"></script>
</body>

</html>
